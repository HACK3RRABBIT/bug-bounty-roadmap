<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>۴۰۴ — پیدا نشد | نقشه‌راه باگ‌بانتی</title>
<link rel="icon" type="image/svg+xml" href="/bug-bounty-roadmap/assets/logo.svg">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0b0e14;--text:#e7ebf3;--dim:#9aa4b8;--accent:#22d3ee;--accent2:#a78bfa;}
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(1000px 500px at 50% -10%, rgba(34,211,238,.08), transparent 60%), var(--bg);
    color:var(--text);font-family:'Vazirmatn',sans-serif;text-align:center;padding:24px;
  }
  .box{max-width:520px;}
  .code{
    font-family:'JetBrains Mono',monospace;font-size:clamp(3.5rem,14vw,6rem);font-weight:700;
    background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;
    background-clip:text;color:transparent;line-height:1;margin-bottom:6px;
    animation:glitch 3.5s infinite;
  }
  @keyframes glitch{0%,92%,100%{transform:translate(0,0);opacity:1}93%{transform:translate(-2px,1px);opacity:.85}95%{transform:translate(2px,-1px);opacity:.9}}
  h1{font-size:1.4rem;margin:0 0 10px;}
  p{color:var(--dim);font-size:.95rem;line-height:1.8;margin:0 0 26px;}
  .term{
    font-family:'JetBrains Mono',monospace;direction:ltr;text-align:left;font-size:.8rem;color:#67e8f9;
    background:#11151f;border:1px solid #232a3b;border-radius:10px;padding:14px 16px;margin:0 0 26px;
  }
  .term .p{color:#6ee7b7}
  a.btn{
    display:inline-block;background:var(--accent);color:#03181c;font-weight:700;text-decoration:none;
    padding:11px 26px;border-radius:10px;font-size:.9rem;
  }
</style>
</head>
<body>
  <div class="box">
    <div class="code">404</div>
    <h1>این مسیر پیدا نشد 🐞</h1>
    <div class="term"><span class="p">hunter@roadmap</span>:~$ curl <span style="color:#fbbf24">این صفحه</span><br>HTTP/1.1 404 Not Found</div>
    <p>ظاهراً یا لینک اشتباه بوده، یا این صفحه هنوز ساخته نشده. نگران نباش — نقشه‌راه اصلی همیشه سر جاشه.</p>
    <a class="btn" href="/bug-bounty-roadmap/">بازگشت به نقشه‌راه</a>
  </div>
</body>
</html>
